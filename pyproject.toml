[build-system]
requires = [
    "setuptools==59.6.0; python_version < '3.7'",
    "setuptools>=61; python_version >= '3.7'",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "opytimark"
dynamic = ["version"]
description = "Python Optimization Benchmarking Functions"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "Apache 2.0" }
authors = [
    { name = "Gustavo Rosa", email = "gustavo.rosa@unesp.br" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.19.5",
]

[project.optional-dependencies]
tests = [
    "coverage",
    "pytest",
    "pytest-pep8",
]
dev = [
    "pre-commit>=2.17.0; python_full_version >= '3.6.1'",
    "pylint>=2.7.2; python_full_version >= '3.6.2'",
]

[project.urls]
Homepage = "https://github.com/gugarosa/opytimark"
Documentation = "https://opytimark.readthedocs.io"
Issues = "https://github.com/gugarosa/opytimark/issues"

[dependency-groups]
dev = [
    "coverage>=5.5",
    "pre-commit>=2.17.0; python_full_version >= '3.6.1'",
    "pylint>=2.7.2; python_full_version >= '3.6.2'",
    "pytest>=6.2.2",
]
docs = [
    "sphinx>=3.0.3",
]

[tool.uv]
environments = ["python_version >= '3.8'"]

[tool.setuptools.dynamic]
version = { attr = "opytimark.__version__" }

[tool.setuptools.packages.find]
include = ["opytimark*"]

[tool.setuptools.package-data]
"opytimark.data" = ["*.tar.gz"]

[tool.black]
line-length = 88
target-version = ["py36"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = ["-v", "--durations=10"]
norecursedirs = ["build"]
