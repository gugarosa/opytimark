[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opytimark"
dynamic = ["version"]
description = "Python Optimization Benchmarking Functions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Gustavo Rosa", email = "gustavo.rosa@unesp.br" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.1.0",
]

[project.optional-dependencies]
tests = [
    "coverage>=7.10.0",
    "flake8>=7.3.0",
    "pytest>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/gugarosa/opytimark"
Documentation = "https://opytimark.readthedocs.io"
Issues = "https://github.com/gugarosa/opytimark/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.0",
]
docs = [
    "sphinx>=8.2.3,<10",
]

[tool.setuptools.dynamic]
version = { attr = "opytimark.__version__" }

[tool.setuptools.packages.find]
include = ["opytimark*"]

[tool.setuptools.package-data]
"opytimark.data" = ["*.tar.gz"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = ["-v", "--durations=10"]
norecursedirs = ["build", "dist"]
